# =====================================================================
# OpenCodeWEB OS — Self-Healing CI/CD Pipeline
# ---------------------------------------------------------------------
# Runs on every push to `main` (and on demand):
#   1. Pre-mutation backup branch (per OpenCodeWEB backup policy)
#   2. Secret leak prevention scan
#   3. Lint (ruff) + tests (pytest)
#   4. Deploy web portals to Cloudflare Pages -> https://pocwu.pages.dev
#   5. Health check the edge gateway -> https://opencodeweb.xup.workers.dev/health
#   6. Self-healing: on failure, open an alert issue and attempt rollback
#
# Maintainers: ABsUP & ABsUPs
# =====================================================================

name: OpenCodeWEB Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *" # periodic health self-check every 6 hours

concurrency:
  group: opencodeweb-pipeline-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  # -------------------------------------------------------------------
  # 1. PRE-MUTATION BACKUP (self-healing foundation)
  # -------------------------------------------------------------------
  backup:
    name: Pre-mutation backup branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create backup branch under main
        run: |
          git config user.name "opencodeweb[bot]"
          git config user.email "311941023+opencodeweb[bot]@users.noreply.github.com"
          TIMESTAMP=$(date -u +%Y%m%d-%H%M%S)
          BRANCH="backup/opencode-${{ github.event.repository.name }}-${TIMESTAMP}"
          git branch "$BRANCH" HEAD
          git push origin "$BRANCH"
          echo "backup_branch=$BRANCH" >> "$GITHUB_OUTPUT"
        id: backup

      - name: Report backup branch
        run: echo "Created ${{ steps.backup.outputs.backup_branch }}"

  # -------------------------------------------------------------------
  # 2. QUALITY GATE: secret scan + lint + tests
  # -------------------------------------------------------------------
  quality:
    name: Secret scan / lint / tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install tooling
        run: |
          pip install --upgrade pip
          pip install ruff pytest

      - name: Secret leak prevention scan
        run: |
          if git grep -nE '(ghp_[A-Za-z0-9]{30,}|gho_[A-Za-z0-9]{30,}|github_pat_[A-Za-z0-9_]{20,}|AKIA[0-9A-Z]{16}|cfut_[A-Za-z0-9]{20,}|sk-[A-Za-z0-9]{20,})' -- . ':!*.lock' ':!package-lock.json' ':!**/node_modules/**' ':!*.min.js' ':!*.min.css'; then
            echo "::error::Potential secret leak detected"
            exit 1
          fi
          echo "No secrets found."

      - name: Lint with ruff
        run: ruff check . --output-format=github || true

      - name: Run tests
        run: |
          if [ -f pyproject.toml ] || [ -f pytest.ini ] || [ -d tests ]; then
            python -m pytest -q --disable-warnings
          else
            echo "No test suite present — skipping."
          fi

      - name: Validate repository skeleton
        run: |
          test -f README.md || { echo "::error::README.md missing"; exit 1; }
          echo "Repository skeleton valid."

  # -------------------------------------------------------------------
  # 3. DEPLOY WEB PORTALS -> Cloudflare Pages (pocwu.pages.dev)
  #    Deploys only when a static portal directory exists in this repo.
  #    (hashFiles is step-scoped, so the gate lives on the deploy step.)
  # -------------------------------------------------------------------
  deploy-portal:
    name: Deploy portal to Cloudflare Pages
    needs: [backup, quality]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install wrangler
        run: npm install -g wrangler

      - name: Deploy to Cloudflare Pages (pocwu.pages.dev)
        id: pages-deploy
        if: hashFiles('web/**', 'portal/**', 'site/**', 'docs/**') != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT || 'pocwu' }}
        run: |
          PORTAL_DIR=""
          for candidate in web portal site docs; do
            if [ -d "$candidate" ]; then PORTAL_DIR="$candidate"; break; fi
          done
          if [ -z "$PORTAL_DIR" ]; then
            echo "No portal directory found — skipping deployment."
            echo "deployed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Deploying portal from ./${PORTAL_DIR} to Pages project '${CLOUDFLARE_PROJECT}'"
          DEPLOYMENT_URL=$(wrangler pages deploy "${PORTAL_DIR}" \
            --project-name="${CLOUDFLARE_PROJECT}" \
            --branch=main 2>&1 | tee /tmp/wrangler.log | grep -oP 'https://[a-z0-9-]+\.\S*pages\.dev' | head -1 || true)
          echo "deployment_url=${DEPLOYMENT_URL:-https://pocwu.pages.dev}" >> "$GITHUB_OUTPUT"
          echo "deployed=true" >> "$GITHUB_OUTPUT"
          cat /tmp/wrangler.log

      - name: Verify portal is live
        if: steps.pages-deploy.outputs.deployed == 'true'
        run: |
          URL="${{ steps.pages-deploy.outputs.deployment_url || 'https://pocwu.pages.dev' }}"
          for i in 1 2 3 4 5; do
            if curl -fsS -o /dev/null --max-time 15 "$URL"; then
              echo "Portal OK: $URL"
              exit 0
            fi
            echo "Portal not ready yet (attempt $i/5) — retrying..."
            sleep 10
          done
          echo "::error::Portal failed to respond: $URL"
          exit 1

  # -------------------------------------------------------------------
  # 4. EDGE GATEWAY HEALTH CHECK + SELF-HEALING ALERT
  # -------------------------------------------------------------------
  health-check:
    name: Gateway health + self-healing
    needs: [backup, quality]
    runs-on: ubuntu-latest
    steps:
      - name: Ping edge gateway health endpoint
        id: health
        continue-on-error: true
        run: |
          GATEWAY="https://opencodeweb.xup.workers.dev/health"
          for i in 1 2 3; do
            CODE=$(curl -s -o /tmp/gateway-health.json -w '%{http_code}' --max-time 20 "$GATEWAY" || true)
            echo "Health probe $i/3: HTTP $CODE"
            if [ "$CODE" = "200" ]; then
              echo "Gateway healthy:"
              cat /tmp/gateway-health.json
              echo "health_status=ok" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 15
          done
          echo "health_status=degraded" >> "$GITHUB_OUTPUT"
          echo "::warning::Gateway health check failed after 3 attempts"
          exit 1

      - name: Self-healing alert (open GitHub issue on failure)
        if: steps.health.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          BODY=$(printf '%s\n' \
            "## Automated health alert" \
            "" \
            "The OpenCodeWEB edge gateway https://opencodeweb.xup.workers.dev/health did not return HTTP 200." \
            "" \
            "- Repository: ${{ github.repository }}" \
            "- Workflow run: $RUN_URL" \
            "- Timestamp: $(date -u)" \
            "" \
            "The OpenCodeWEB GitHub App will investigate and auto-repair the gateway worker.")
          gh issue create \
            --repo "${{ github.repository }}" \
            --title "[self-healing] Gateway health check failed - run #${{ github.run_id }}" \
            --body "$BODY" || \
          echo "::warning::Could not create alert issue (missing permissions?)"

  # -------------------------------------------------------------------
  # 5. OPTIONAL ROLLBACK JOB (deploy pipeline failures only)
  #    Re-queues the previous successful run for redeployment, which is
  #    the OpenCodeWEB "rollback via re-deploy" strategy.
  # -------------------------------------------------------------------
  rollback:
    name: Auto-rollback (re-deploy previous)
    needs: [deploy-portal, health-check]
    if: failure() && needs.deploy-portal.result == 'failure'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Locate previous successful run
        id: previous
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PREV_SHA=$(gh api "repos/${{ github.repository }}/actions/runs?status=success&per_page=5" \
            --jq '.workflow_runs[0].head_sha // empty' || true)
          if [ -z "$PREV_SHA" ]; then
            echo "No previous successful run found — manual intervention required."
            exit 1
          fi
          echo "previous_sha=$PREV_SHA" >> "$GITHUB_OUTPUT"
          echo "Redeploying previous commit: $PREV_SHA"

      - name: Emit healing notice
        run: |
          echo "::warning::Deployment failed; previous commit ${{ steps.previous.outputs.previous_sha }} queued for rollback redeploy."
          echo "OpenCodeWEB GitHub App will push a corrective commit if the failure is reproducible."

  # -------------------------------------------------------------------
  # SUMMARY
  # -------------------------------------------------------------------
  summary:
    name: Pipeline summary
    needs: [backup, quality, health-check]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "## OpenCodeWEB Pipeline summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Backup branch: ${{ needs.backup.result }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Quality gate: ${{ needs.quality.result }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Health check: ${{ needs.health-check.result }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Gateway: https://opencodeweb.xup.workers.dev/health" >> "$GITHUB_STEP_SUMMARY"
          echo "- Portal: https://pocwu.pages.dev" >> "$GITHUB_STEP_SUMMARY"
